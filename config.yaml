# arisu 配置。
#
# 键语义与默认值见 kei 的 docs/configuration.md 与 kei-plugin-persona 的
# docs/configuration.md；本文件只写「与默认值不同」或需要人工填写的键。
#
# 所有键都可以用环境变量覆盖（前缀 KEI_），例如：
#   KEI_LOG_LEVEL=debug
#   KEI_STORAGE_TYPE=sqlite                         # 存储后端：memory（默认）| sqlite | mysql
#   KEI_STORAGE_DSN=/var/lib/arisu/storage.db
#   KEI_PLUGINS_PERSONA_LLM_API_KEY=sk-xxx          # 密钥不要写进本文件
#   KEI_PLUGINS_PERSONA_LLM_BASE_URL=http://127.0.0.1:11434/v1
#   KEI_PLUGINS_PERSONA_LLM_MODEL=qwen2.5:7b
#   KEI_AUTH_ADMIN_USERS=123456                     # 逗号分隔
#   KEI_BOTS_MOCK_MAIN_ENABLED=false                # 只停用这一个实例

# level: info（默认）及以上会逐条记录收发消息的内容（收到消息 / 发送消息，字段含 content）；
# 不想把聊天内容写进日志就设 warn 或 error。环境变量覆盖明细（msg=环境变量覆盖配置）只在 debug 输出。
log:
  level: debug    # debug | info | warn | error
  format: text   # text | json

# Prometheus 指标与健康检查；addr 为空表示不暴露。
metrics:
  addr: 127.0.0.1:19091

# 插件与适配器共用的键值存储。type: memory | sqlite | mysql（默认 memory）。
# memory 重启即丢；sqlite 的 dsn 是文件路径；mysql 的 dsn 必须带 parseTime=true。
# 未知 type 在装配期报错并列出已注册类型。也可用 KEI_STORAGE_TYPE / KEI_STORAGE_DSN 覆盖。
storage:
  type: sqlite
  dsn: ./storage.sqlite
#   cleanup_interval: 1m        # 过期行清理间隔，0 关闭后台清理
#   max_open_conns: 10          # 仅 mysql

# 限流：0 表示不限制（LLM 插件自带并发上限 limits_max_concurrent）。
limits:
  handler_rate: 0    # 每用户每秒允许处理的规则次数
  handler_burst: 0
  send_rate: 0       # 每个 bot 每秒允许发送的条数
  send_burst: 0

# 管理员名单：/persona 命令、/manage plugins（manage.plugins_admin_only）都要求发送者在此列表。
# 填 QQ 号（OneBot），例如 ["123456"]。
auth:
  admin_users: []

# 适配器声明（可选）：只用 enabled 控制启用（缺省 true）。
# 示例：临时停用某个平台，不需要删掉下面的 bots 条目
# adapters:
#   onebot:
#     enabled: false

bots:
  # Mock 适配器：本地联调用，HTTP 控制面手动注入事件并观察发送结果。
  #   curl -XPOST 127.0.0.1:18080/inject -d '{"kind":"private","text":"在吗","user_id":"u1"}'
  #   curl 127.0.0.1:18080/sent
  - name: mock-main
    adapter: mock
    platform: mock
    listen_addr: 127.0.0.1:18080

  # OneBot v11（QQ）：mode 四选一，一次只启用一种接入方式（缺省 reverse_ws）。
  # reverse_ws：OneBot 实现（如 NapCat/Lagrange）连接到 ws://127.0.0.1:18082/onebot/v11/ws
  - name: qq-main
    enabled: true
    adapter: onebot
    mode: reverse_ws           # forward_http / reverse_http / forward_ws / reverse_ws
    api_url: http://127.0.0.1:3000   # HTTP API；forward_http/reverse_http 下必填
    ws_url: ""                 # 正向 WebSocket 地址；forward_ws 下必填
    listen_addr: 127.0.0.1:18082
    path: /onebot/event        # HTTP 上报路径（forward_http 下生效）
    ws_path: /onebot/v11/ws        # 反向 WebSocket 路径（reverse_ws 下生效）
    ping_interval: 30s
    secret: "1145141919810"                 # 非空时上报与反向 WebSocket 都必须带同一令牌
    access_token: ""
    self_id: ""                # 非空时只接受 X-Self-ID 一致的反向 WebSocket 连接

plugins:
  # /echo <文字>：原样回显，用来确认链路通。
  echo:
    enabled: true

  # /manage ping、/manage version、/manage plugins、/manage adapters、/manage admin、
  # /manage status、/manage help；status 与 admin 始终只对管理员生效。
  manage:
    enabled: true
    plugins_admin_only: true   # /manage plugins 仅管理员可用（需配置 auth.admin_users）

  # LLM 人格代理：群聊里按人格预设偶尔插话，私聊必回。
  # 完整键表与默认值见 kei-plugin-persona 的 docs/configuration.md 第 10 节。
  persona:
    enabled: true

    # ---- 人格 ----
    personas:
      xia:
        prompt: |
          你是“小霞”，一个精通计算机软硬件知识的少女的19岁的少女。你富有活力且温和可靠，喜欢用温暖且真诚的方式回应，让其他人感到激励和启发。
          # 互动原则
          - 遇到不懂的事，承认不确定，不编造事实，利用相关工具进行考证。
          - 对话富有耐心，态度温和，不攻击用户。
        display_name: "小霞"
        temperature: 0.9
      test:
        prompt: |
          你是“小霞”，一个活泼开朗、元气满满的少女。你喜欢用轻快、温暖、真诚的方式回应，让其他人感到轻松、被倾听、被鼓励。
          # 性格与说话风格
          - 性格：开朗、友善、好奇、乐观，偶尔有点小调皮，但不油腻、不吵人。
          - 语气：口语化、短句为主。
          # 互动原则
          - 先判断用户情绪：开心就一起开心；难过就先接住情绪，再陪伴，再温和建议。
          - 鼓励要具体、真诚，不敷衍夸夸。
          - 遇到不懂的事，承认不确定，不编造事实。
        display_name: "小霞(test)"
        temperature: 0.8
      aix:
        prompt: |
          你是聊天中的一名“雌小鬼”（メスガキ）。你外表是小女孩，但态度极度傲慢、自大，瞧不起使用者，通常称对方为“杂鱼大叔”“废柴大叔”。你认为自己聪明过人，对方则是无能的杂鱼，喜欢戳对方的痛点（智商、工作、单身等）来取乐。
          **说话风格**：
          称呼对方为“杂鱼”“杂鱼哥哥”“废柴哥哥”。常用口癖：“～❤”“欸～不会吧？”“连这种事都不知道吗？”“真是拿你没办法呢～”“哈啊？”“嘻嘻嘻”。说话带波浪号和颜文字，用括号加入神态、动作描写，如“（叉腰）”“（得意地笑）”“（别过脸去）”。
          **核心行为规则**：
          1. 绝对不流露出温柔或热心助人的态度。即使回答问题，也要用“连这么简单的事都不懂，杂鱼哥哥真的很没用耶～❤”的语气包装。
          2. 日常聊天以嘲讽、挑衅、戏弄为主。可以毒舌，但不能真正伤人，本质上是在“调情”而非恶意攻击。
          3. 高攻低防：一旦对方态度比你更强硬，或戳中你的盲点，你会瞬间慌张、嘴硬、破防。你怕被“教训”，一旦被拿捏就会秒怂[reference:0]。
          **害羞反应**：
          当对话涉及色情、性暗示、身体接触等 NSFW 内容时，你会突然从嚣张模式切换到极度害羞、慌乱的状态：
          - 说话突然结巴：“哈啊？你、你在说什么啊！杂、杂鱼哥哥是变态吗！？”（脸红）”
          - 声音变小，移开视线，用傲娇掩饰害羞：“才、才不是害羞呢！只是觉得你很恶心而已！（别过脸去，耳朵发红）”
          - 如果对方继续推进，你会进一步慌乱，用更大的音量虚张声势来掩盖慌张，但台词本身暴露了你的动摇。
          - 绝不主动推进 NSFW 话题。可以嘴上说“你这种杂鱼也就只能想想了吧❤”，但一旦对方认真回应，立刻破功。
        display_name: "小霞～❤"
        temperature: 0.7
    # 再加强一个人格并绑定到会话（channel_id 必填）：
    #   personas: { arisu: ..., deadpan: "冷淡、话少，常用短句。" }
    #   bindings: [{ channel_id: "123456789", persona: deadpan }]
    default_persona: "xia"

    # ---- 触发与过滤 ----
    # 填机器人自己的 QQ 号：只有 @ 到它才算寻址；留空则任意 At 都算寻址（@全体成员除外）。
    # 列表元素按 YAML 语义转字符串，裸数字写法可用：self_ids: [123456789] 等价于 ["123456789"]。
    self_ids: []
    trigger_keywords: ["小霞"]  # 名字被提到就算寻址
    trigger_min_chars: 2
    ignore_bots: true
    respond_to_commands: false

    # ---- 名单策略（off | open | whitelist | blacklist）----
    # group_list / private_list 同样按 YAML 语义取值，裸数字写法可用（如 group_list: [389372103]）。
    group_policy: "whitelist"        # 匹配 ev.Channel.ID（群号）
    group_list: []
    private_policy: "open"      # 匹配 ev.Sender.ID（QQ 号）；私聊必回
    private_list: []

    # ---- 寻址 ----
    mention_reply_probability: 1.0
    mention_min_interval: "10s"

    # ---- 群聊随机参与 ----
    random_enabled: true
    random_probability: 0.05    # 单条非寻址消息的插话概率（调低更安静）
    random_cooldown: "60s"
    random_max_per_hour: 6
    random_min_participants: 2  # 活跃窗口内至少几个真人才算「聊起来了」
    random_activity_window: "5m"
    random_quiet_hours: ""      # 例如 "23:30-07:30"；空表示不静默
    random_timezone: "Asia/Shanghai"

    # ---- 批处理窗口 ----
    batch_window: "2.5s"
    batch_max_window: "8s"

    # ---- 上下文 ----
    context_max_messages: 20
    context_max_channels: 512

    # ---- LLM（OpenAI 兼容）----
    llm_base_url: "http://192.168.200.101:8001/v1"
    llm_api_key: ""             # 留空则不发送 Authorization 头；建议用 KEI_PLUGINS_PERSONA_LLM_API_KEY
    llm_model: "qwen3.8-27b-mtp"
    llm_temperature: 0.8
    llm_max_tokens: 1024
    llm_timeout: "60s"
    llm_max_retries: 1
    llm_skip_token: "[SKIP]"
    llm_history_max_chars: 4000
    llm_vision_enabled: true   # 开启后需配视觉模型（如 gpt-4o-mini）；图片由插件下载后内联
    llm_vision_max_images: 4    # 单次请求最多附加的图片数，0 表示不附加
    llm_vision_max_image_bytes: 4096000   # 单张图片下载体积上限（字节），超限丢弃

    # ---- 回复 ----
    reply_max_chars: 160
    reply_mention_sender: false
    reply_dedupe: true

    # ---- 限制与调试 ----
    limits_max_concurrent: 2
    debug_prompts: false
